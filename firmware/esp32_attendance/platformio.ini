[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
upload_port = COM3
monitor_port = COM3
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.36.2

[env:esp32dev-ota]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
upload_protocol = espota
upload_port = 192.168.1.73
upload_flags =
    --port=3232
    --timeout=30
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.36.2

