server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files - no cache on HTML so updates appear immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://attendance-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO WebSocket connections to backend
    location /socket.io/ {
        proxy_pass http://attendance-backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # MCP Server — use dynamic resolution so nginx starts even if mcp is down
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mcp_backend "http://attendance-mcp:3100";

    # MCP Server — SSE stream (must disable buffering for SSE)
    location /mcp/sse {
        proxy_pass $mcp_backend/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding off;
    }

    # MCP Server — JSON-RPC messages
    location /mcp/messages {
        proxy_pass $mcp_backend/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type application/json;
    }

    # MCP Server — Health check
    location /mcp/health {
        proxy_pass $mcp_backend/health;
    }

    # Serve static assets without aggressive immutable cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
